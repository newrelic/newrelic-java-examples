syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.grpcnetty.grpc.streaming";
option java_outer_classname = "HelloStreamingProto";

package streaming;

service StreamingGreeter {
  rpc SayHelloStreaming (stream StreamRequest) returns (stream StreamReply) {}
}

message StreamRequest {
  string name = 1;
}

message StreamReply {
  string message = 1;
}
