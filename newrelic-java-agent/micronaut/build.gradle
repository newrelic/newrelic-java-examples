plugins {
    id 'application'
    id 'java'
}

repositories {
    mavenCentral()
}

def micronautVersion = '4.10.17'
def newrelicApiVersion = '9.4.0'

dependencies {
    annotationProcessor platform("io.micronaut.platform:micronaut-platform:$micronautVersion")
    annotationProcessor "io.micronaut:micronaut-inject-java"
    annotationProcessor "io.micronaut:micronaut-http-validation"

    implementation platform("io.micronaut.platform:micronaut-platform:$micronautVersion")
    implementation "io.micronaut:micronaut-inject"
    implementation "io.micronaut:micronaut-runtime"
    implementation "io.micronaut:micronaut-http-server-netty"
    implementation "io.micronaut:micronaut-http-client"
    implementation "io.micronaut:micronaut-jackson-databind"
    implementation "io.projectreactor:reactor-core"
    // Present on the classpath purely so the agent's netty-reactor-0.9.0 module (gated on this
    // artifact) becomes eligible, matching the original #3038 reporter's own matched-module list
    // ("netty-reactor-0.9.0"). Not otherwise used by this app — Micronaut's own HTTP server uses
    // raw io.netty directly, not reactor-netty's HttpServer/HttpTrafficHandler.
    implementation "io.projectreactor.netty:reactor-netty-http:1.3.7"

    implementation "com.newrelic.agent.java:newrelic-api:$newrelicApiVersion"

    runtimeOnly "ch.qos.logback:logback-classic"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.example.micronaut.Application'

    if (project.hasProperty('agent')) {
        def agentJar = project.hasProperty('agentJar')
            ? project.property('agentJar')
            : file('newrelic/newrelic.jar').absolutePath
        def configFile = project.hasProperty('agentConfig')
            ? project.property('agentConfig')
            : file('newrelic/newrelic.yml').absolutePath
        applicationDefaultJvmArgs = [
            "-javaagent:${agentJar}",
            "-Dnewrelic.config.file=${configFile}",
        ]
    }
}
